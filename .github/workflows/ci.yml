name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # No system deps yet — v0.0.x shells out to jmtpfs / adb, doesn't
      # link libmtp directly. When the libmtp-direct bridge lands
      # (PLAN.md Phase 2.7) reintroduce libmtp here.

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose
